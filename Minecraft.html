<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的世界辅助工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #00d9ff;
            text-shadow: 0 0 10px #00d9ff;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-open {
            background: #00d9ff;
            color: #1a1a2e;
        }
        .btn-close {
            background: #ff4757;
            color: #fff;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px currentColor;
        }

        /* 可拖动悬浮窗 */
        .float-window {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #00d9ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            font-weight: bold;
            cursor: move;
            user-select: none;
            z-index: 999;
            box-shadow: 0 0 15px #00d9ff;
            display: none;
        }

        /* 功能菜单面板 */
        .menu-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 500px;
            background: #16213e;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
            display: none;
            flex-direction: column;
            z-index: 1000;
            overflow: hidden;
        }
        .menu-header {
            padding: 1rem;
            background: #00d9ff;
            color: #1a1a2e;
            font-weight: bold;
            text-align: center;
        }
        .menu-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        .menu-item {
            padding: 0.8rem;
            margin: 0.5rem 0;
            background: #1a1a2e;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .menu-item:hover {
            background: #00d9ff;
            color: #1a1a2e;
        }

        /* 底部提示 */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1rem 2rem;
            background: #00d9ff;
            color: #1a1a2e;
            border-radius: 8px;
            font-weight: bold;
            opacity: 0;
            transition: 0.3s;
            z-index: 1001;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的世界辅助工具</h1>
        <div class="btn-group">
            <button class="btn btn-open" onclick="openFloat()">开启悬浮窗</button>
            <button class="btn btn-close" onclick="closeFloat()">关闭悬浮窗</button>
        </div>
    </div>

    <!-- 悬浮窗 -->
    <div class="float-window" id="floatWindow">我的世界</div>

    <!-- 功能菜单 -->
    <div class="menu-panel" id="menuPanel">
        <div class="menu-header">修改功能列表</div>
        <div class="menu-list">
            <div class="menu-item" onclick="showToast('修改类 开启成功')">修改类</div>
            <div class="menu-item" onclick="showToast('32K 开启成功')">32K</div>
            <div class="menu-item" onclick="showToast('制裁盒子 开启成功')">制裁盒子</div>
            <div class="menu-item" onclick="showToast('无权限tp 开启成功')">无权限tp</div>
            <div class="menu-item" onclick="showToast('无权限kill 开启成功')">无权限kill</div>
            <div class="menu-item" onclick="showToast('成员强制管理 开启成功')">成员强制管理</div>
            <div class="menu-item" onclick="showToast('创造模式 开启成功')">创造模式</div>
            <div class="menu-item" onclick="showToast('5D皮肤 开启成功')">5D皮肤</div>
            <div class="menu-item" onclick="showToast('熊大 开启成功')">熊大</div>
            <div class="menu-item" onclick="showToast('卡卡 开启成功')">卡卡</div>
            <div class="menu-item" onclick="showToast('起床战争 开启成功')">起床战争</div>
            <div class="menu-item" onclick="showToast('杀戮光环 开启成功')">杀戮光环</div>
            <div class="menu-item" onclick="showToast('兔子 开启成功')">兔子</div>
        </div>
    </div>

    <!-- 提示文字 -->
    <div class="toast" id="toast"></div>

    <script>
        const floatWindow = document.getElementById('floatWindow');
        const menuPanel = document.getElementById('menuPanel');
        const toast = document.getElementById('toast');

        // 悬浮窗拖动
        let isDragging = false;
        let offsetX, offsetY;

        floatWindow.addEventListener('mousedown', e => {
            isDragging = true;
            offsetX = e.clientX - floatWindow.offsetLeft;
            offsetY = e.clientY - floatWindow.offsetTop;
        });

        document.addEventListener('mousemove', e => {
            if(isDragging){
                floatWindow.style.left = (e.clientX - offsetX) + 'px';
                floatWindow.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('mouseup', () => isDragging = false);

        // 点击悬浮窗打开菜单
        floatWindow.onclick = () => {
            menuPanel.style.display = 'flex';
        };

        // 点击空白关闭菜单
        document.onclick = function(e){
            if(!menuPanel.contains(e.target) && e.target !== floatWindow){
                menuPanel.style.display = 'none';
            }
        }

        // 开启悬浮窗
        function openFloat(){
            floatWindow.style.display = 'flex';
        }

        // 关闭悬浮窗
        function closeFloat(){
            floatWindow.style.display = 'none';
            menuPanel.style.display = 'none';
        }

        // 底部提示
        function showToast(text){
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(()=>{
                toast.classList.remove('show');
            },1500);
        }
    </script>
</body>
</html>
